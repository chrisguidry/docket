# The repository is a uv workspace.  Each language's package lives in its own
# directory, and the tools that work across the whole repository live here.
[tool.uv.workspace]
members = ["python"]

[tool.uv.sources]
pydocket = { workspace = true }

[dependency-groups]
dev = [
    "pydocket",
    "codespell>=2.4.1",
    "docker>=7.1.0",
    "ipython>=8.0.0",
    "loq>=0.1.0a3",
    "prek>=0.3.1",
    "pyright>=1.1.408",
    "zensical>=0.0.32",
    "mkdocstrings>=1.0.2",
    "mkdocstrings-python>=2.0.1",
]
examples = [
    "fastapi>=0.120.0",
    "pydantic>=2.12.5",
    # Security: starlette >=0.49.1 fixes session middleware vulnerability
    "starlette>=0.49.1",
    "uvicorn>=0.40.0",
]

[tool.ruff]
target-version = "py310"

[tool.pyright]
include = ["chaos"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"
