default_max_lines = 500
respect_gitignore = true
exclude = ["**/uv.lock", "**/.git/**", "**/docs/**", "plans/**"]

# Source files get a higher default limit (750)
[[rules]]
path = "python/src/**/*.py"
max_lines = 750

# Source files that still need exceptions above 750
[[rules]]
path = "python/src/docket/worker.py"
max_lines = 1471

[[rules]]
path = "python/src/docket/cli/__init__.py"
max_lines = 969

[[rules]]
path = "python/src/docket/execution.py"
max_lines = 1336

[[rules]]
path = "python/src/docket/docket.py"
max_lines = 1105

[[rules]]
path = "python/src/docket/_redis.py"
max_lines = 996

[[rules]]
path = "python/src/docket/dependencies/_concurrency.py"
max_lines = 862

[[rules]]
path = "python/tests/instrumentation/test_counters.py"
max_lines = 552
