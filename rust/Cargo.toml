# docket-rs and the crates that build and test it.  Each language keeps its
# own package directory; see plans/README.md.
[workspace]
members = ["docket", "docket-macros", "conformance-agent"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/chrisguidry/docket"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false }
chrono-tz = "0.10.4"
clap = "4.6.7"
croner = "4.0.1"
docket-rs = { path = "docket" }
docket-rs-macros = { version = "=0.3.0", path = "docket-macros" }
futures = "0.3.34"
futures-util = "0.3.34"
gethostname = "1.1.0"
opentelemetry = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false }
opentelemetry_sdk = { version = "0.33", default-features = false }
percent-encoding = "2.3.2"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.3"
redis = { version = "1.7.1", default-features = false }
rstest = "0.27.0"
rustls = { version = "0.23", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
syn = "3.0.6"
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.23.2"

# The memory engine's dependencies, at the versions burner-redis uses.
bytes = "1.11"
mlua = "0.12"
ordered-float = "5"
parking_lot = "0.12.5"
sha1 = "0.11"

[workspace.lints.rust]
missing_docs = "warn"
# cargo-llvm-cov sets coverage_nightly on the nightly coverage job.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Hook implementations are `async fn` whether or not they await, because
# that is how the hook traits read.
unused_async = "allow"
unused_async_trait_impl = "allow"
