# docket-rs and the crates that build and test it.  Each language keeps its
# own package directory; see plans/README.md.
[workspace]
members = ["docket", "docket-macros", "conformance-agent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/chrisguidry/docket"

[workspace.lints.rust]
missing_docs = "warn"
# cargo-llvm-cov sets coverage_nightly on the nightly coverage job.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
