[package]
name = "docket-conformance-agent"
description = "docket-rs's agent for the conformance driver in conformance/"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
clap = { workspace = true, features = ["derive"] }
docket-rs = { workspace = true, features = ["prometheus"] }
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
opentelemetry-otlp = { workspace = true, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "metrics"] }
rand.workspace = true
redis = { workspace = true, features = ["aio", "tokio-comp", "connection-manager"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v7"] }

[lints]
workspace = true
