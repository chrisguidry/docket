[package]
name = "docket-rs"
description = "A distributed background task system for Rust, backed by Redis"
readme = "README.md"
keywords = ["redis", "tasks", "queue", "background", "async"]
categories = ["asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**", "lua/*.lua", "LICENSE", "README.md"]

[lib]
name = "docket"

[dependencies]
docket-rs-macros = { version = "=0.1.0", path = "../docket-macros" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
