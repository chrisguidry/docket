[package]
name = "docket-rs"
description = "A distributed background task system for Rust, backed by Redis"
readme = "README.md"
keywords = ["redis", "tasks", "queue", "background", "async"]
categories = ["asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**", "lua/*.lua", "LICENSE", "README.md"]

[lib]
name = "docket"

[features]
default = ["tls"]
# docket::cli: a worker's command-line options for an application's own CLI.
cli = ["dep:clap", "tokio/signal", "prometheus"]
# memory:// runs the in-process engine in src/memory, for users' test suites.
memory = ["dep:mlua", "dep:parking_lot", "dep:bytes", "dep:ordered-float", "dep:sha1"]
# rediss:// connections, through rustls with its ring crypto backend.
tls = ["redis/tokio-rustls-comp", "redis/tls-rustls-webpki-roots", "dep:rustls"]
# docket::prometheus: serves the metrics in the Prometheus text format.  It
# reads them on demand, through the SDK's custom reader.
prometheus = [
    "dep:opentelemetry_sdk",
    "opentelemetry_sdk/experimental_metrics_custom_reader",
    "tokio/net",
]

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
chrono-tz.workspace = true
clap = { workspace = true, features = ["derive", "env"], optional = true }
croner.workspace = true
docket-rs-macros.workspace = true
redis = { workspace = true, features = ["aio", "tokio-comp", "script", "streams", "cluster-async", "sentinel", "token-based-authentication"] }
futures.workspace = true
gethostname.workspace = true
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["metrics"], optional = true }
percent-encoding.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "io-util"] }
tokio-util.workspace = true

# The memory engine's dependencies.
bytes = { workspace = true, optional = true }
mlua = { workspace = true, features = ["lua54", "send", "vendored"], optional = true }
ordered-float = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
# redis turns off rustls's default features, which leaves rustls no crypto
# backend; the tls feature gives it ring.
rustls = { workspace = true, features = ["ring", "std", "tls12"], optional = true }

[dev-dependencies]
futures-util.workspace = true
# The tests read docket's spans and metrics back from the SDK's in-memory
# exporters.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
sha1.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[package.metadata.docs.rs]
# docs.rs builds the crate once, so it turns on every feature to document
# memory:// and the CLI options too.
all-features = true

[lints]
workspace = true
