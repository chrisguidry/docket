[package]
name = "docket-rs"
description = "A distributed background task system for Rust, backed by Redis"
readme = "README.md"
keywords = ["redis", "tasks", "queue", "background", "async"]
categories = ["asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**", "lua/*.lua", "LICENSE", "README.md"]

[lib]
name = "docket"

[features]
# docket::cli: a worker's command-line options for an application's own CLI.
cli = ["dep:clap", "tokio/signal"]
# memory:// runs the in-process engine in src/memory, for users' test suites.
memory = ["dep:mlua", "dep:parking_lot", "dep:bytes", "dep:ordered-float", "dep:sha1"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
croner = "4.0.1"
docket-rs-macros = { version = "=0.1.0", path = "../docket-macros" }
redis = { version = "1.7.1", features = ["aio", "tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "script", "streams", "cluster-async", "sentinel", "token-based-authentication"] }
futures = "0.3.34"
gethostname = "1.1.0"
percent-encoding = "2.3.2"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["v7"] }
tokio = { version = "1.53.2", features = ["rt", "time", "sync", "macros", "io-util"] }
tokio-util = "0.7.19"

# The memory engine's dependencies, at the versions burner-redis uses.
bytes = { version = "1.11", optional = true }
mlua = { version = "0.10", features = ["lua54", "send", "vendored"], optional = true }
ordered-float = { version = "5", optional = true }
parking_lot = { version = "0.12.5", optional = true }
sha1 = { version = "0.10", optional = true }

[dev-dependencies]
futures-util = "0.3.34"
sha1 = "0.10"
rstest = "0.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
