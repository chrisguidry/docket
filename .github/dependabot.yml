# Terraform writes this file from github.com/chrisguidry/.github, and
# writes it again over any change made here. To change it, edit this
# repository's entry in repositories.yaml there.

version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    # A release has a week to be found bad and yanked before it lands here.
    cooldown:
      default-days: 7
    # One pull request a week carries every update of this ecosystem.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directories: ["/"]
    schedule:
      interval: weekly
    # A release has a week to be found bad and yanked before it lands here.
    cooldown:
      default-days: 7
    # One pull request a week carries every update of this ecosystem.
    groups:
      uv:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories: ["/rust"]
    schedule:
      interval: weekly
    # A release has a week to be found bad and yanked before it lands here.
    cooldown:
      default-days: 7
    # One pull request a week carries every update of this ecosystem.
    groups:
      cargo:
        patterns: ["*"]
