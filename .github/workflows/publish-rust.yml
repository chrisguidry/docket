name: Publish to crates.io

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  rust:
    name: Run the Rust workflow
    # docket-rs releases are tagged rust/v0.1.0.
    if: startsWith(github.event.release.tag_name, 'rust/v')
    uses: ./.github/workflows/rust.yml
    secrets: inherit
    permissions:
      contents: read

  prek:
    name: Run the Prek workflow
    if: startsWith(github.event.release.tag_name, 'rust/v')
    uses: ./.github/workflows/prek.yml

  publish:
    name: Publish docket-rs to crates.io
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [rust, prek]
    environment:
      name: crates-io
      url: https://crates.io/crates/docket-rs
    permissions:
      id-token: write # Required for trusted publishing
      contents: read
    defaults:
      run:
        working-directory: rust
    # This job holds a publish token, so its actions are pinned to commits:
    # a tag that moves cannot change what runs here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Cargo takes the version from Cargo.toml, not from the tag, so the
      # two must agree before anything is published.
      - name: Check the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "docket-rs") | .version')
          if [ "rust/v$version" != "$TAG" ]; then
            echo "The tag $TAG does not match docket-rs $version" >&2
            exit 1
          fi

      # crates.io trades this job's OIDC identity for a short-lived token, so
      # no long-lived token is stored anywhere.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # docket-rs depends on the exact version of docket-rs-macros, so the
      # macros go first.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked --package docket-rs-macros
          cargo publish --locked --package docket-rs
