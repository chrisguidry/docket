name: Publish to PyPI

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  ci:
    name: Run the Python workflow
    # pydocket releases are tagged python/v0.27.0, or bare before the
    # monorepo.  Another language's release does not publish to PyPI.
    if: startsWith(github.event.release.tag_name, 'python/v') || !contains(github.event.release.tag_name, '/')
    uses: ./.github/workflows/python.yml

  prek:
    name: Run the Prek workflow
    if: startsWith(github.event.release.tag_name, 'python/v') || !contains(github.event.release.tag_name, '/')
    uses: ./.github/workflows/prek.yml

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [ci, prek]
    environment:
      name: pypi
      url: https://pypi.org/p/pydocket
    permissions:
      id-token: write  # Required for trusted publishing and PEP 740 attestations
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Need full history for proper versioning with hatch-vcs
          fetch-depth: 0

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: false

      - name: Build package
        run: uv build --package pydocket

      - name: Publish to PyPI with PEP 740 attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
