name: Lock

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A manual run and the scheduled run would both force-push uv-lock-upgrade.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# pydocket is a library, so its floors in pyproject.toml stay as low as it
# supports, and only uv.lock moves.  Dependabot's uv updater always raises
# floors, so this workflow upgrades the lockfile and opens the PR itself.  It
# opens the PR with a GitHub App token, because a PR opened with GITHUB_TOKEN
# does not start CI.
#
# The upgrade job resolves the lockfile, and the open-pr job creates the app
# token and opens the PR.  Both jobs check out github.sha, so the lockfile
# matches the pyproject.toml it was resolved from.
jobs:
  upgrade:
    name: Upgrade uv.lock
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Upgrade the lockfile
        id: lock
        run: |
          uv lock --upgrade 2> upgrade.log
          if git diff --quiet uv.lock; then
            echo "uv.lock is already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the lockfile
        if: steps.lock.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uv-lock
          path: |
            uv.lock
            upgrade.log
          if-no-files-found: error
          retention-days: 1

  open-pr:
    name: Open or update the PR
    needs: upgrade
    if: needs.upgrade.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uv-lock
          path: ${{ runner.temp }}/uv-lock

      - name: Create an app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LOCK_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOCK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # gh auth setup-git makes gh the git credential helper, so git push
      # uses GH_TOKEN from this step's environment.
      - name: Commit the lockfile and open or update the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: uv-lock-upgrade
          ARTIFACT: ${{ runner.temp }}/uv-lock
        run: |
          cp "$ARTIFACT/uv.lock" uv.lock

          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

          title="Upgrade the locked uv dependencies"
          {
            echo "This upgrades every package in uv.lock to its latest version that the floors in pyproject.toml allow. The floors do not change."
            echo
            echo '```'
            grep -E '^(Updated|Added|Removed) ' "$ARTIFACT/upgrade.log"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          git switch -c "$BRANCH"
          printf '%s\n\n' "$title" | cat - "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/message.txt"
          git commit -q -F "$RUNNER_TEMP/message.txt" uv.lock
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
