name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance, ${{ matrix.implementation }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        implementation: [python@main, python@release, rust@main]

    steps:
      - uses: actions/checkout@v7
        with:
          # python@release finds the newest pydocket tag.
          fetch-depth: 0

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --upgrade-package redis

      - name: Install Rust
        if: startsWith(matrix.implementation, 'rust')
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        if: startsWith(matrix.implementation, 'rust')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: backoff
        run: uv run python -m conformance backoff --implementation ${{ matrix.implementation }}

      - name: perpetual
        run: uv run python -m conformance perpetual --implementation ${{ matrix.implementation }}

      - name: cancel-before-start
        run: uv run python -m conformance cancel-before-start --implementation ${{ matrix.implementation }}

      - name: graceful-drain
        run: uv run python -m conformance graceful-drain --implementation ${{ matrix.implementation }}

      - name: concurrency-limit
        run: uv run python -m conformance concurrency-limit --implementation ${{ matrix.implementation }}

      - name: redelivery
        run: uv run python -m conformance redelivery --implementation ${{ matrix.implementation }}

      - name: perpetual-single-flight
        run: uv run python -m conformance perpetual-single-flight --implementation ${{ matrix.implementation }}

      - name: same-key
        run: uv run python -m conformance same-key --implementation ${{ matrix.implementation }}

      - name: telemetry
        run: uv run python -m conformance telemetry --implementation ${{ matrix.implementation }}

      - name: admission-failure
        run: uv run python -m conformance admission-failure --implementation ${{ matrix.implementation }}

      # The newest pydocket release predates the generation checks on a
      # perpetual task's cancel of itself and on a retry, so these two hold
      # only the working trees to them.
      - name: stop-after-replace
        if: matrix.implementation != 'python@release'
        run: uv run python -m conformance stop-after-replace --implementation ${{ matrix.implementation }}

      - name: retry-after-replace
        if: matrix.implementation != 'python@release'
        run: uv run python -m conformance retry-after-replace --implementation ${{ matrix.implementation }}

  telemetry:
    name: Telemetry, python@main and rust@main
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --upgrade-package redis

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: telemetry
        run: uv run python -m conformance telemetry --implementation python@main --implementation rust@main

  chaos:
    name: Chaos tests, python@main and python@release
    runs-on: ubuntu-26.04
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --upgrade-package redis

      - name: chaos
        run: uv run python -m conformance chaos --implementation python@main --implementation python@release

  chaos-rust:
    name: Chaos tests, rust@main
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --upgrade-package redis

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: chaos
        run: uv run python -m conformance chaos --implementation rust@main
