name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance, ${{ matrix.implementation }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        implementation: [python@main, python@release]

    steps:
      - uses: actions/checkout@v7
        with:
          # python@release finds the newest pydocket tag.
          fetch-depth: 0

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --upgrade-package redis

      - name: backoff
        run: uv run python -m conformance backoff --implementation ${{ matrix.implementation }}

      - name: perpetual
        run: uv run python -m conformance perpetual --implementation ${{ matrix.implementation }}

      - name: cancel-before-start
        run: uv run python -m conformance cancel-before-start --implementation ${{ matrix.implementation }}

      - name: graceful-drain
        run: uv run python -m conformance graceful-drain --implementation ${{ matrix.implementation }}

      - name: concurrency-limit
        run: uv run python -m conformance concurrency-limit --implementation ${{ matrix.implementation }}

      - name: redelivery
        run: uv run python -m conformance redelivery --implementation ${{ matrix.implementation }}

      - name: perpetual-single-flight
        run: uv run python -m conformance perpetual-single-flight --implementation ${{ matrix.implementation }}

      - name: same-key
        run: uv run python -m conformance same-key --implementation ${{ matrix.implementation }}

  chaos:
    name: Chaos tests
    runs-on: ubuntu-26.04
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --upgrade-package redis

      - name: chaos
        run: uv run python -m conformance chaos --implementation python@main --implementation python@release
