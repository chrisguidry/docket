name: Prek

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# The hooks lint every language's files and the tools at the root, so they
# run in a workflow of their own rather than in one language's.
jobs:
  prek:
    name: Prek checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Run prek
        uses: j178/prek-action@v2
        env:
          # The Rust workflow runs rustfmt and clippy with its own toolchain.
          SKIP: rustfmt,clippy
