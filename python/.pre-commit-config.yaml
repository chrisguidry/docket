# The root config's hooks, ruff among them, also cover this directory.
repos:
  - repo: local
    hooks:
      - id: pyright
        name: pyright (docket package)
        entry: uv run pyright --verifytypes docket --ignoreexternal
        language: system
        types: [python]
        pass_filenames: false
      - id: pyright
        name: pyright (tests and conformance agent)
        entry: uv run pyright tests conformance-agent
        language: system
        types: [python]
        pass_filenames: false
