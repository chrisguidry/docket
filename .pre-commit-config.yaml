repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
      - id: ruff-format

  - repo: local
    hooks:
      # Each package ships its own copy of the shared Lua scripts and the
      # license, because every registry packages only its own directory.
      # A copy that differs from the source fails the hook.
      - id: sync-lua
        name: sync protocol/ scripts into each package
        entry: bash -c 'rm -f python/src/docket/lua/*.lua && cp protocol/*.lua python/src/docket/lua/'
        language: system
        pass_filenames: false
        always_run: true
      - id: sync-license
        name: sync LICENSE into each package
        entry: cp LICENSE python/LICENSE
        language: system
        pass_filenames: false
        always_run: true
      - id: loq
        name: loq (file size limits)
        entry: uv run loq
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright (conformance driver)
        entry: uv run pyright conformance
        language: system
        types: [python]
        pass_filenames: false
